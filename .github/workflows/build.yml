name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux / macOS 目前只有平台无关的内部包，没有可用的程序入口，
  # 因此这里只做编译与静态检查，不产出发布包。
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile check (linux/darwin)
        run: |
          for os in linux darwin; do
            echo "== $os =="
            GOOS=$os CGO_ENABLED=0 go build ./internal/...
            GOOS=$os CGO_ENABLED=0 go vet ./internal/...
          done

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      # 打 tag 发布时，用 tag 号覆盖 exe 内的版本信息，避免手动改 winres.json
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          go run github.com/tc-hib/go-winres@latest make --in winres/winres.json --out cmd/keyboard/rsrc.syso --arch amd64 --no-suffix --file-version $ver --product-version $ver
        env:
          CGO_ENABLED: "0"

      - name: Build
        run: go build -ldflags "-w -s -H windowsgui" -o keyboard.exe ./cmd/keyboard
        env:
          CGO_ENABLED: "0"

      - name: Package
        run: Compress-Archive -Path keyboard.exe, README.md -DestinationPath keyboard-windows-amd64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-windows-amd64
          path: keyboard-windows-amd64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keyboard-windows-amd64.zip
          generate_release_notes: true
