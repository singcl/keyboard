name: build

on:
  push:
    branches: [master, "rust", "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test (平台无关模块)
        run: cargo test --lib --bins

      # 打 tag 时用 tag 号作为程序内显示的版本，其余情况显示 Cargo.toml 版本
      - name: Build universal binary
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            export KEYBOARD_PLUS_VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          for arch in arm64 x86_64; do
            target="aarch64-apple-darwin"
            [[ "$arch" == "x86_64" ]] && target="x86_64-apple-darwin"
            cargo build --release --target "$target" --bins
            cp "target/$target/release/keyboard-plus" "dist/keyboard-plus-$arch"
            cargo build --release --target "$target" --no-default-features --bins
            cp "target/$target/release/keyboard-plus" "dist/keyboard-plus-slim-$arch"
          done
          lipo -create -output dist/keyboard-plus dist/keyboard-plus-arm64 dist/keyboard-plus-x86_64
          lipo -create -output dist/keyboard-plus-slim dist/keyboard-plus-slim-arm64 dist/keyboard-plus-slim-x86_64
          chmod +x dist/keyboard-plus dist/keyboard-plus-slim
          cd dist
          zip keyboard-plus-macos-universal.zip keyboard-plus
          zip keyboard-plus-macos-universal-slim.zip keyboard-plus-slim

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-plus-macos-universal
          path: dist/keyboard-plus-macos-universal*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keyboard-plus-macos-universal.zip
            dist/keyboard-plus-macos-universal-slim.zip
          body_path: .github/release-body.md
          generate_release_notes: false

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      # 打 tag 发布时，用 tag 号覆盖 exe 内的版本信息与「检查更新」的比较基准
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "KEYBOARD_PLUS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --release
          cargo build --release --no-default-features
          cp target/release/keyboard-plus.exe keyboard-plus.exe
          cargo build --release --no-default-features
          cp target/release/keyboard-plus.exe keyboard-plus-slim.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path keyboard-plus.exe, README.md -DestinationPath keyboard-plus-windows-amd64.zip -Force
          Compress-Archive -Path keyboard-plus-slim.exe, README.md -DestinationPath keyboard-plus-windows-amd64-slim.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-plus-windows-amd64
          path: keyboard-plus-windows-amd64*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keyboard-plus-windows-amd64.zip
            keyboard-plus-windows-amd64-slim.zip
          body_path: .github/release-body.md
          generate_release_notes: false
