name: build

on:
  push:
    branches: [master, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 测试用纯 Go 模式：internal 各包不依赖 cgo，
      # 且 cgo 链接出来的测试二进制在新版 macOS 上会因缺少 LC_UUID 无法运行。
      # 真正的 cgo 构建由下一步验证。
      - name: Test
        run: go test ./internal/...
        env:
          CGO_ENABLED: "0"

      # 打 tag 时用 tag 号作为程序内显示的版本，其余情况显示 dev-<commit>
      - name: Build universal binary
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -ldflags "-w -s -X main.appVersion=$VERSION" \
              -o dist/keyboard-plus-$arch ./cmd/keyboardmac
            CGO_ENABLED=1 GOARCH=$arch go build -tags noupdate -ldflags "-w -s -X main.appVersion=$VERSION" \
              -o dist/keyboard-plus-slim-$arch ./cmd/keyboardmac
          done
          lipo -create -output dist/keyboard-plus dist/keyboard-plus-arm64 dist/keyboard-plus-amd64
          lipo -create -output dist/keyboard-plus-slim dist/keyboard-plus-slim-arm64 dist/keyboard-plus-slim-amd64
          chmod +x dist/keyboard-plus dist/keyboard-plus-slim
          cd dist
          zip keyboard-plus-macos-universal.zip keyboard-plus
          zip keyboard-plus-macos-universal-slim.zip keyboard-plus-slim
        env:
          CGO_ENABLED: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-plus-macos-universal
          path: dist/keyboard-plus-macos-universal*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keyboard-plus-macos-universal.zip
            dist/keyboard-plus-macos-universal-slim.zip
          body_path: .github/release-body.md
          generate_release_notes: false

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      # 打 tag 发布时，用 tag 号覆盖 exe 内的版本信息，避免手动改 winres.json
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          go run github.com/tc-hib/go-winres@latest make --in winres/winres.json --out cmd/keyboard/rsrc.syso --arch amd64 --no-suffix --file-version $ver --product-version $ver
        env:
          CGO_ENABLED: "0"

      - name: Build
        run: |
          go build -ldflags "-w -s -H windowsgui" -o keyboard-plus.exe ./cmd/keyboard
          go build -tags noupdate -ldflags "-w -s -H windowsgui" -o keyboard-plus-slim.exe ./cmd/keyboard
        env:
          CGO_ENABLED: "0"

      - name: Package
        run: |
          Compress-Archive -Path keyboard-plus.exe, README.md -DestinationPath keyboard-plus-windows-amd64.zip -Force
          Compress-Archive -Path keyboard-plus-slim.exe, README.md -DestinationPath keyboard-plus-windows-amd64-slim.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-plus-windows-amd64
          path: keyboard-plus-windows-amd64*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keyboard-plus-windows-amd64.zip
            keyboard-plus-windows-amd64-slim.zip
          body_path: .github/release-body.md
          generate_release_notes: false
